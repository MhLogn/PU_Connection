<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" stroke="#000000"/>
    </marker>
  </defs>
  <!-- Nền trắng chuẩn Draw.io -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Tiêu đề nhóm -->
  <text x="410" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Sơ đồ Use-case Nhóm 4: Trợ lý Học vụ Trí tuệ Nhân tạo (Phenikaa AI)</text>
  
  
  <!-- System Boundary -->
  <rect x="220" y="55" width="410" height="305" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="235" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Phân hệ Trợ lý Trí tuệ Nhân tạo AI</text>

  <!-- Actors -->
  
    <g class="actor">
      <!-- Head -->
      <circle cx="100" cy="180" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <!-- Body -->
      <line x1="100" y1="192" x2="100" y2="220" stroke="#000000" stroke-width="1.5"/>
      <!-- Arms -->
      <line x1="82" y1="202" x2="118" y2="202" stroke="#000000" stroke-width="1.5"/>
      <!-- Left Leg -->
      <line x1="100" y1="220" x2="86" y2="244" stroke="#000000" stroke-width="1.5"/>
      <!-- Right Leg -->
      <line x1="100" y1="220" x2="114" y2="244" stroke="#000000" stroke-width="1.5"/>
      <!-- Label -->
      <text x="100" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Sinh viên (User)</text>
    </g>
  
  
    <g class="system-actor">
      <rect x="660" y="130" width="130" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="725" y="146" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">&lt;&lt;system&gt;&gt;</text>
      <text x="725" y="162" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Google Gemini AI</text>
    </g>
  
  
    <g class="system-actor">
      <rect x="660" y="250" width="130" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="725" y="266" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">&lt;&lt;system&gt;&gt;</text>
      <text x="725" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Cloud Firestore</text>
    </g>
  

  <!-- Use Cases -->
  
    <g class="usecase">
      <ellipse cx="370" cy="125" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC17</text>
      <text x="370" y="137" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Chat hỏi đáp học vụ AI</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="370" cy="205" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="201" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC18</text>
      <text x="370" y="217" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Tóm tắt nội dung tài liệu</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="370" cy="285" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="281" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC19</text>
      <text x="370" y="297" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Quản lý / Xóa lịch sử</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="545" cy="125" rx="75" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="545" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">NLP Engine</text>
      <text x="545" y="137" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Xử lý ngôn ngữ</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="545" cy="250" rx="75" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="545" y="246" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Save History</text>
      <text x="545" y="262" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Lưu hội thoại</text>
    </g>
  

  <!-- Associations Sinh viên -->
  <line x1="130" y1="180" x2="260" y2="130" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="190" x2="260" y2="205" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="200" x2="260" y2="285" stroke="#000000" stroke-width="1.2"/>

  <!-- Include / Extend -->
  
    <line x1="480" y1="125" x2="470" y2="125" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="443" y="111" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="475" y="123" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  
  
    <line x1="370" y1="179" x2="370" y2="151" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="338" y="151" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="370" y="163" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
    
  
  
    <line x1="480" y1="140" x2="500" y2="230" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="458" y="171" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="490" y="183" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  

  <!-- External System links -->
  <line x1="620" y1="125" x2="660" y2="145" stroke="#000000" stroke-width="1.2"/>
  <line x1="620" y1="250" x2="660" y2="270" stroke="#000000" stroke-width="1.2"/>
  <line x1="480" y1="285" x2="660" y2="280" stroke="#000000" stroke-width="1.2"/>

</svg>