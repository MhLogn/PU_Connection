<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" stroke="#000000"/>
    </marker>
  </defs>
  <!-- Nền trắng chuẩn Draw.io -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Tiêu đề nhóm -->
  <text x="410" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Sơ đồ Use-case Nhóm 5: Tin nhắn Thời gian thực &amp; Nhóm học tập</text>
  
  
  <!-- System Boundary -->
  <rect x="220" y="55" width="410" height="325" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="235" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Phân hệ Tin nhắn &amp; Nhóm học tập</text>

  <!-- Actors -->
  
    <g class="actor">
      <!-- Head -->
      <circle cx="100" cy="190" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <!-- Body -->
      <line x1="100" y1="202" x2="100" y2="230" stroke="#000000" stroke-width="1.5"/>
      <!-- Arms -->
      <line x1="82" y1="212" x2="118" y2="212" stroke="#000000" stroke-width="1.5"/>
      <!-- Left Leg -->
      <line x1="100" y1="230" x2="86" y2="254" stroke="#000000" stroke-width="1.5"/>
      <!-- Right Leg -->
      <line x1="100" y1="230" x2="114" y2="254" stroke="#000000" stroke-width="1.5"/>
      <!-- Label -->
      <text x="100" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Sinh viên (User)</text>
    </g>
  
  
    <g class="system-actor">
      <rect x="660" y="130" width="130" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="725" y="146" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">&lt;&lt;system&gt;&gt;</text>
      <text x="725" y="162" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Firestore Realtime</text>
    </g>
  
  
    <g class="system-actor">
      <rect x="660" y="250" width="130" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="725" y="266" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">&lt;&lt;system&gt;&gt;</text>
      <text x="725" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Cloudinary CDN</text>
    </g>
  

  <!-- Use Cases -->
  
    <g class="usecase">
      <ellipse cx="370" cy="125" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC20</text>
      <text x="370" y="137" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Nhắn tin trực tiếp 1-1</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="370" cy="215" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="211" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC21</text>
      <text x="370" y="227" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Tạo &amp; quản lý nhóm</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="370" cy="305" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="301" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC22</text>
      <text x="370" y="317" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Gửi file / ảnh đính kèm</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="545" cy="125" rx="75" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="545" y="121" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Sync Message</text>
      <text x="545" y="137" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Đồng bộ tức thời</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="545" cy="270" rx="75" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="545" y="266" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Upload Media</text>
      <text x="545" y="282" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Tải ảnh/tệp chat</text>
    </g>
  

  <!-- Associations Sinh viên -->
  <line x1="130" y1="180" x2="260" y2="130" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="195" x2="260" y2="215" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="210" x2="260" y2="305" stroke="#000000" stroke-width="1.2"/>

  <!-- Include / Extend -->
  
    <line x1="480" y1="125" x2="470" y2="125" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="443" y="111" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="475" y="123" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  
  
    <line x1="480" y1="215" x2="495" y2="150" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="455.5" y="168.5" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="487.5" y="180.5" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  
  
    <line x1="370" y1="279" x2="370" y2="241" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="338" y="246" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="370" y="258" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
    
  
  
    <line x1="480" y1="305" x2="470" y2="275" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="443" y="276" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="475" y="288" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  

  <!-- External System links -->
  <line x1="620" y1="125" x2="660" y2="145" stroke="#000000" stroke-width="1.2"/>
  <line x1="620" y1="270" x2="660" y2="270" stroke="#000000" stroke-width="1.2"/>

</svg>