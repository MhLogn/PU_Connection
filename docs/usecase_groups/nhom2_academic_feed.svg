      <line x1="100" y1="280" x2="86" y2="304" stroke="#000000" stroke-width="1.5"/>
      <!-- Right Leg -->
      <line x1="100" y1="280" x2="114" y2="304" stroke="#000000" stroke-width="1.5"/>
      <!-- Label -->
      <text x="100" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Sinh viên (User)</text>
    </g>
  
  
    <g class="system-actor">
      <rect x="660" y="140" width="140" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="156" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">&lt;&lt;system&gt;&gt;</text>
