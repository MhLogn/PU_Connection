<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" stroke="#000000"/>
    </marker>
  </defs>
  <!-- Nền trắng chuẩn Draw.io -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Tiêu đề nhóm -->
  <text x="420" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Sơ đồ Use-case Nhóm 2: Bảng tin Học thuật và Tương tác Cộng đồng</text>
  
  
  <!-- System Boundary -->
  <rect x="220" y="55" width="410" height="445" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
