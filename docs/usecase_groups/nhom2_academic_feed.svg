    <line x1="370" y1="441" x2="370" y2="216" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="338" y="314.5" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="370" y="326.5" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
    
  

  <!-- External System links -->
