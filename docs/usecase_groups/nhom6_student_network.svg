      <text x="420" y="321" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC26</text>
      <text x="420" y="337" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Đăng ký tham gia sự kiện</text>
    </g>
  
  
    <g class="usecase">
