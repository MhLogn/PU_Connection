<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" stroke="#000000"/>
    </marker>
  </defs>
  <!-- Nền trắng chuẩn Draw.io -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Tiêu đề nhóm -->
  <text x="410" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Sơ đồ Use-case Nhóm 6: Mạng lưới Sinh viên, CLB &amp; An toàn Học đường</text>
  
  
  <!-- System Boundary -->
  <rect x="220" y="55" width="410" height="445" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="235" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Phân hệ Mạng lưới Sinh viên &amp; CLB</text>

  <!-- Actors -->
  
    <g class="actor">
      <!-- Head -->
      <circle cx="100" cy="220" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <!-- Body -->
      <line x1="100" y1="232" x2="100" y2="260" stroke="#000000" stroke-width="1.5"/>
      <!-- Arms -->
      <line x1="82" y1="242" x2="118" y2="242" stroke="#000000" stroke-width="1.5"/>
      <!-- Left Leg -->
      <line x1="100" y1="260" x2="86" y2="284" stroke="#000000" stroke-width="1.5"/>
      <!-- Right Leg -->
      <line x1="100" y1="260" x2="114" y2="284" stroke="#000000" stroke-width="1.5"/>
      <!-- Label -->
      <text x="100" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Sinh viên (User)</text>
    </g>
  
  
    <g class="actor">
      <!-- Head -->
      <circle cx="720" cy="280" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
