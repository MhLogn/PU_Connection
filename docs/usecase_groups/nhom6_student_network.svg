  <line x1="690" y1="290" x2="535" y2="330" stroke="#000000" stroke-width="1.2"/>

  <!-- Include / Extend -->
  
    <line x1="420" y1="159" x2="420" y2="141" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="388" y="136" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="420" y="148" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
    
  
  
    <line x1="420" y1="369" x2="420" y2="141" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="388" y="241" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="420" y="253" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
    
  

</svg>