      <!-- Label -->
      <text x="720" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Chủ nhiệm CLB / Admin</text>
    </g>
  

  <!-- Use Cases -->
  
    <g class="usecase">
      <ellipse cx="420" cy="115" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="111" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC23</text>
      <text x="420" y="127" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Tìm sinh viên theo khoa</text>
    </g>
  
  
