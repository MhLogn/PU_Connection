      <text x="420" y="461" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC28</text>
      <text x="420" y="477" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Xem thông báo hệ thống</text>
    </g>
  

  <!-- Associations Sinh vien -->
  <line x1="130" y1="210" x2="305" y2="120" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="220" x2="305" y2="185" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="230" x2="305" y2="255" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="240" x2="305" y2="325" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="250" x2="305" y2="395" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="305" y2="465" stroke="#000000" stroke-width="1.2"/>

