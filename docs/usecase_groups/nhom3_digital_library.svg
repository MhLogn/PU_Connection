<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="840" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" stroke="#000000"/>
    </marker>
  </defs>
  <!-- Nền trắng chuẩn Draw.io -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Tiêu đề nhóm -->
  <text x="420" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Sơ đồ Use-case Nhóm 3: Kho Học liệu số và Trình đọc PDF</text>
  
  
  <!-- System Boundary -->
  <rect x="220" y="55" width="410" height="385" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="235" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Phân hệ Kho Học liệu &amp; PDF Viewer</text>

  <!-- Actors -->
  
    <g class="actor">
      <!-- Head -->
      <circle cx="100" cy="220" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <!-- Body -->
      <line x1="100" y1="232" x2="100" y2="260" stroke="#000000" stroke-width="1.5"/>
      <!-- Arms -->
      <line x1="82" y1="242" x2="118" y2="242" stroke="#000000" stroke-width="1.5"/>
      <!-- Left Leg -->
      <line x1="100" y1="260" x2="86" y2="284" stroke="#000000" stroke-width="1.5"/>
      <!-- Right Leg -->
      <line x1="100" y1="260" x2="114" y2="284" stroke="#000000" stroke-width="1.5"/>
      <!-- Label -->
      <text x="100" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Sinh viên (User)</text>
    </g>
  
  
    <g class="system-actor">
      <rect x="660" y="170" width="140" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="186" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">&lt;&lt;system&gt;&gt;</text>
      <text x="730" y="202" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Cloudinary CDN</text>
    </g>
  
  
    <g class="system-actor">
      <rect x="660" y="300" width="140" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="730" y="316" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">&lt;&lt;system&gt;&gt;</text>
      <text x="730" y="332" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Cloud Firestore</text>
    </g>
  

  <!-- Use Cases -->
  
    <g class="usecase">
      <ellipse cx="370" cy="115" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="111" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC12</text>
      <text x="370" y="127" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Đăng tải học liệu</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="370" cy="185" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="181" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC13</text>
      <text x="370" y="197" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Tìm kiếm tài liệu học</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="370" cy="255" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="251" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC14</text>
      <text x="370" y="267" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Xem tài liệu In-app PDF</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="370" cy="325" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="321" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC15</text>
      <text x="370" y="337" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Tải tài liệu về máy</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="370" cy="395" rx="110" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="370" y="391" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC16</text>
      <text x="370" y="407" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Đánh giá học liệu</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="545" cy="115" rx="75" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="545" y="111" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Upload PDF</text>
      <text x="545" y="127" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Lưu trữ tệp PDF</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="545" cy="255" rx="75" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="545" y="251" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Stream PDF</text>
      <text x="545" y="267" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Luồng đọc tệp</text>
    </g>
  

  <!-- Associations Sinh viên -->
  <line x1="130" y1="210" x2="260" y2="120" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="220" x2="260" y2="185" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="230" x2="260" y2="255" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="240" x2="260" y2="325" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="250" x2="260" y2="395" stroke="#000000" stroke-width="1.2"/>

  <!-- Include / Extend -->
  
    <line x1="480" y1="115" x2="470" y2="115" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="443" y="101" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="475" y="113" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  
  
    <line x1="480" y1="255" x2="470" y2="255" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="443" y="241" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="475" y="253" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  
  
    <line x1="370" y1="299" x2="370" y2="281" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="338" y="276" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="370" y="288" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
    
  
  
    <line x1="370" y1="369" x2="370" y2="281" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="338" y="311" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="370" y="323" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
    
  

  <!-- External System links -->
  <line x1="620" y1="115" x2="660" y2="180" stroke="#000000" stroke-width="1.2"/>
  <line x1="620" y1="255" x2="660" y2="195" stroke="#000000" stroke-width="1.2"/>
  <line x1="480" y1="185" x2="660" y2="315" stroke="#000000" stroke-width="1.2"/>
  <line x1="480" y1="395" x2="660" y2="330" stroke="#000000" stroke-width="1.2"/>

</svg>