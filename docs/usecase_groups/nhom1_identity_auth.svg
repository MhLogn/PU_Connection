<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000" stroke="#000000"/>
    </marker>
  </defs>
  <!-- Nền trắng chuẩn Draw.io -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Tiêu đề nhóm -->
  <text x="410" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Sơ đồ Use-case Nhóm 1: Quản lý Định danh và Tài khoản</text>
  
  
  <!-- System Boundary -->
  <rect x="220" y="55" width="410" height="400" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="235" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Phân hệ Xác thực &amp; Tài khoản</text>

  <!-- Actors -->
  
    <g class="actor">
      <!-- Head -->
      <circle cx="100" cy="150" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <!-- Body -->
      <line x1="100" y1="162" x2="100" y2="190" stroke="#000000" stroke-width="1.5"/>
      <!-- Arms -->
      <line x1="82" y1="172" x2="118" y2="172" stroke="#000000" stroke-width="1.5"/>
      <!-- Left Leg -->
      <line x1="100" y1="190" x2="86" y2="214" stroke="#000000" stroke-width="1.5"/>
      <!-- Right Leg -->
      <line x1="100" y1="190" x2="114" y2="214" stroke="#000000" stroke-width="1.5"/>
      <!-- Label -->
      <text x="100" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Sinh viên (User)</text>
    </g>
  
  
    <g class="actor">
      <!-- Head -->
      <circle cx="100" cy="360" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <!-- Body -->
      <line x1="100" y1="372" x2="100" y2="400" stroke="#000000" stroke-width="1.5"/>
      <!-- Arms -->
      <line x1="82" y1="382" x2="118" y2="382" stroke="#000000" stroke-width="1.5"/>
      <!-- Left Leg -->
      <line x1="100" y1="400" x2="86" y2="424" stroke="#000000" stroke-width="1.5"/>
      <!-- Right Leg -->
      <line x1="100" y1="400" x2="114" y2="424" stroke="#000000" stroke-width="1.5"/>
      <!-- Label -->
      <text x="100" y="440" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Quản trị viên (Admin)</text>
    </g>
  
  
    <g class="system-actor">
      <rect x="660" y="220" width="130" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="725" y="236" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">&lt;&lt;system&gt;&gt;</text>
      <text x="725" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Firebase Auth</text>
    </g>
  

  <!-- Use Cases -->
  
    <g class="usecase">
      <ellipse cx="420" cy="110" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="106" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC01</text>
      <text x="420" y="122" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Đăng ký tài khoản</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="420" cy="175" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="171" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC02</text>
      <text x="420" y="187" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Đăng nhập hệ thống</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="420" cy="240" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="236" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC03</text>
      <text x="420" y="252" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Quên / Đổi mật khẩu</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="420" cy="305" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="301" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC04</text>
      <text x="420" y="317" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Cập nhật hồ sơ</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="420" cy="370" rx="115" ry="26" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="420" y="366" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UC05</text>
      <text x="420" y="382" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Đăng xuất thiết bị</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="540" cy="110" rx="75" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="540" y="106" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Verify Email</text>
      <text x="540" y="122" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Xác thực email</text>
    </g>
  
  
    <g class="usecase">
      <ellipse cx="540" cy="175" rx="75" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text x="540" y="171" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Validate</text>
      <text x="540" y="187" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Kiểm tra định danh</text>
    </g>
  

  <!-- Associations Sinh viên -->
  <line x1="130" y1="160" x2="305" y2="110" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="170" x2="305" y2="175" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="180" x2="305" y2="240" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="190" x2="305" y2="305" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="200" x2="305" y2="370" stroke="#000000" stroke-width="1.2"/>

  <!-- Associations Admin -->
  <line x1="130" y1="370" x2="305" y2="185" stroke="#000000" stroke-width="1.2"/>
  <line x1="130" y1="385" x2="305" y2="375" stroke="#000000" stroke-width="1.2"/>

  <!-- Include / Extend -->
  
    <line x1="500" y1="110" x2="465" y2="110" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="450.5" y="96" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="482.5" y="108" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  
  
    <line x1="500" y1="175" x2="465" y2="175" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="450.5" y="161" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="482.5" y="173" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
    
  
  
    <line x1="420" y1="214" x2="420" y2="201" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    
      <rect x="388" y="193.5" width="64" height="16" fill="#ffffff" stroke="none"/>
      <text x="420" y="205.5" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>
    
  

  <!-- External System links -->
  <line x1="615" y1="110" x2="660" y2="225" stroke="#000000" stroke-width="1.2"/>
  <line x1="615" y1="175" x2="660" y2="235" stroke="#000000" stroke-width="1.2"/>
  <line x1="535" y1="240" x2="660" y2="245" stroke="#000000" stroke-width="1.2"/>
  <line x1="535" y1="370" x2="660" y2="255" stroke="#000000" stroke-width="1.2"/>

</svg>